[package]
name = "carnelian-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Developer CLI for carnelian-compiler (certification via subprocess)"
keywords = ["ruby", "mruby", "rite"]

[[bin]]
name = "carnelian"
path = "src/main.rs"

[dependencies]
carnelian-ast = { workspace = true }
carnelian-compiler = { workspace = true }
carnelian-front-prism = { workspace = true }
carnelian-front-owned = { workspace = true }
clap = { version = "4", features = ["derive"] }
mruby-compiler2-sys = "=0.5.0"

[dev-dependencies]
tempfile = "3"

[package]
name = "carnelian-cli"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Developer CLI for carnelian-compiler (certification via subprocess)"
keywords = ["ruby", "mruby", "rite"]

[[bin]]
name = "carnelian"
path = "src/main.rs"

[dependencies]
carnelian-ast = { workspace = true }
carnelian-compiler = { workspace = true }
carnelian-front-prism = { workspace = true, optional = true }
carnelian-front-mri = { workspace = true }
clap = { version = "4", features = ["derive"] }
mruby-compiler2-sys = { version = "=0.5.0", optional = true }

[features]
default = ["reference", "prism"]
reference = ["dep:mruby-compiler2-sys"]
prism = ["dep:carnelian-front-prism"]

[dev-dependencies]
tempfile = "3"

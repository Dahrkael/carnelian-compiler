[package]
name = "carnelian-ast"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owned Prism AST types generated from config.yml (no C, no FFI)"
keywords = ["ruby", "prism", "ast"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ruby-prism = "=1.9.0"
serde_json = "1"

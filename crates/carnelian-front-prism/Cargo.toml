[package]
name = "carnelian-front-prism"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Phase 1 frontend: thin adapter over ruby-prism FFI (dev/CLI only, never shipping)"
keywords = ["ruby", "prism", "ffi"]

[dependencies]
carnelian-ast = { workspace = true }
ruby-prism = "=1.9.0"
ruby-prism-sys = "=1.9.0"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

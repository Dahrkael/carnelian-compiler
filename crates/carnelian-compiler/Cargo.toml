[package]
name = "carnelian-compiler"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust RITE backend (irep model + writer). No C, no FFI."
keywords = ["ruby", "mruby", "rite", "compiler"]

[features]
# Frontend selectors. The generic `compile_tree` entry takes any
# `BackendNode`; frontend crates are wired by the CLI, so the shipping
# library never links C.
default = ["front-owned"]
front-owned = []
front-prism = []
front-mri = []

[dependencies]
carnelian-ast = { workspace = true }
